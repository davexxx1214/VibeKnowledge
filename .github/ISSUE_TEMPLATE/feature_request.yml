name: Feature request
description: Propose a focused improvement to VibeKnowledge.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow or limitation should this address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: impact
    attributes:
      label: Potential impact
      options:
        - label: This may change the knowledge database format.
        - label: This may add or change network access.
        - label: This may add a new dependency or external service.
