name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Failures still block CI; the helper prints failure categories and registry diagnostics.
  VIBEKNOWLEDGE_AUDIT_TIMEOUT_MS: '60000'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  extension:
    name: VS Code extension
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      # npm 11 uses the Bulk Advisory API, without the retired Quick Audit fallback.
      - run: npm install --global npm@11.19.0
      - name: Show runtime versions
        run: |
          node --version
          npm --version
      - run: npm ci
      - name: Audit production dependencies (with timeout diagnostics)
        run: npm run audit:dependencies
      - run: npm run check
      - run: npm run package -- --out vibe-knowledge.vsix

  mcp-server:
    name: MCP server
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: packages/mcp-server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: packages/mcp-server/package-lock.json
      - run: npm install --global npm@11.19.0
      - name: Show runtime versions
        run: |
          node --version
          npm --version
      - run: npm ci
      - name: Audit production dependencies (with timeout diagnostics)
        run: npm run audit:dependencies
      - run: npm run build
      - run: npm test
